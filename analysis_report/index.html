 if(sel.t=='f'){lvl.set(sel.i,0);let fr=[sel.i];for(let d=1;d<=depth;d++){const nx=[];fr.forEach(x=>{fOut[x].forEach(ei=>{const e=D.edges[ei];if(!edgeOk(e))return;if(mf&&D.funcs[e[1]][1]!=mf)return;edges.push(ei);if(!lvl.has(e[1])){lvl.set(e[1],d);nx.push(e[1])}})});fr=nx}
  fr=[sel.i];for(let d=1;d<=depth;d++){const nx=[];fr.forEach(x=>{fIn[x].forEach(ei=>{const e=D.edges[ei];if(!edgeOk(e))return;if(mf&&D.funcs[e[0]][1]!=mf)return;edges.push(ei);if(!lvl.has(e[0])){lvl.set(e[0],-d);nx.push(e[0])}})});fr=nx}}
 else{const fs=fByMod[sel.i].filter(i=>D.funcs[i][3]!='<module>'||true);const S=new Set(fs);fs.forEach(i=>{fOut[i].forEach(ei=>{const e=D.edges[ei];if(!edgeOk(e)||!S.has(e[1]))return;edges.push(ei);lvl.set(i,lvl.get(i)||0);lvl.set(e[1],lvl.get(e[1])||0)})});
  for(let it=0;it<14;it++)edges.forEach(ei=>{const e=D.edges[ei];if(e[0]!=e[1]&&lvl.get(e[1])<=lvl.get(e[0])&&lvl.get(e[0])<14)lvl.set(e[1],lvl.get(e[0])+1)})}
 const uniq=[...new Set(edges)];let ids=[...lvl.keys()];let note='';if(ids.length>160){ids=ids.slice(0,160);note='节点过多, 仅显示前 160 个; 请缩小深度或使用模块过滤'}
 const idset=new Set(ids),cols={};ids.forEach(i=>{const c=lvl.get(i);cols[c]=(cols[c]||0)+1});const cnt={};
 const ns_=ids.sort((a,b)=>lvl.get(a)-lvl.get(b)||a-b).map(i=>{const c=lvl.get(i);cnt[c]=(cnt[c]||0);const r=cnt[c]++;const f=D.funcs[i],m=D.mods[f[1]];
  return {id:i,t:'f',i,label:f[4],sub:m.id+':'+f[5],x:(c+depth+1)*GX,y:r*GY,fill:m.legacy?'#fcd':f[7].includes('qt_slot')?'#f3d9ff':f[7].includes('hardware_io')?'#ffd0d0':f[7].includes('entry')?'#c9f0c9':'#fff',sel:sel.t=='f'&&sel.i==i,tip:f[4]+' '+f[7].join(',')}});
 const es=uniq.map(ei=>D.edges[ei]).filter(e=>idset.has(e[0])&&idset.has(e[1])).map(e=>({a:e[0],b:e[1],kind:e[2],conf:e[3],label:'L'+e[4],tip:e[5]}));
 draw(ns_,es,note||(sel.t=='f'?'左: 调用者 · 中: 选中函数 · 右: 被调用函数':'模块内函数调用关系 (按调用层级自左向右)'))}
function renderTree(){const V=$('#treeView');let start=sel&&sel.t=='f'?sel.i:D.entry;V.innerHTML='<div class=kv>从 <b>'+D.funcs[start][4]+'</b> 逐层展开(点击 ▸ 展开; ↻ 表示递归/循环, 不再展开)。边: [类型/可信度@行]</div>';
 const mk=(fi,e,path)=>{const d=document.createElement('div');d.className='tn';const f=D.funcs[fi];const rec=path.includes(fi);const outs=fOut[fi].filter(ei=>edgeOk(D.edges[ei]));
  const tg=document.createElement('span');tg.className='tg';tg.textContent=outs.length&&!rec?'▸':'·';d.appendChild(tg);
  const nm=document.createElement('span');nm.className='nm';const col=e?(K[e[2]]||K.call)[0]:'#000';nm.innerHTML=(e?`<span style="color:${col}">[${e[2]}/${e[3]}@L${e[4]}]</span> `:'')+f[4]+` <span class=kv>${D.mods[f[1]].id}:${f[5]}</span>`+(rec?' <b class=warn>↻递归/循环</b>':'')+f[7].filter(x=>x!='constructor').map(x=>`<span class=tag>${x}</span>`).join('');
  nm.onclick=()=>pick('f',fi);d.appendChild(nm);const box=document.createElement('div');box.style.marginLeft='18px';box.hidden=true;d.appendChild(box);
  let done=false;tg.onclick=()=>{if(rec||!outs.length)return;if(!done){done=true;const seen=new Set();outs.forEach(ei=>{const k=D.edges[ei][1]+D.edges[ei][2];if(seen.has(k))return;seen.add(k);box.appendChild(mk(D.edges[ei][1],D.edges[ei],path.concat(fi)))})}box.hidden=!box.hidden;tg.textContent=box.hidden?'▸':'▾'};return d};
 const r=mk(start,null,[]);V.appendChild(r);r.querySelector('.tg').click()}
function render(){$('#treeView').style.display=view=='tree'?'block':'none';svg.style.display=view=='tree'?'none':'block';$('#legend').style.display=view=='tree'?'none':'block';
 if(view=='mod')renderMod();else if(view=='fn')renderFn();else renderTree()}
render();
</script></body></html>
